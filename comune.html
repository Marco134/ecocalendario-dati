<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Eco Calendario · Area del Comune (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
  /* stessi colori dell'app (Tinte in main.dart) */
  :root {
    --sfondo:#F1F4F6; --scheda:#FFFFFF; --testo:#1B1F23; --debole:#4A5560; --linea:#E3E7EA;
    --pannello:#14324A; --accento:#14324A; --chip:#EEF1F4; --okS:#E2F2E8; --okT:#1E6B43; --avvS:#FDEBC4; --avvT:#7A4A00;
    --arancio:#F59E0B; --navy:#14324A; --chiaro:#C9D6E2;
  }
  :root.scuro {
    --sfondo:#0E1822; --scheda:#182635; --testo:#F2F5F7; --debole:#A9B8C6; --linea:#2A3B4D;
    --pannello:#1D4263; --accento:#F59E0B; --chip:#22344A; --okS:#1D3A2E; --okT:#8FD3AE; --avvS:#3A2E12; --avvT:#F6C66B;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--sfondo); color:var(--testo); font:16px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  .barra { max-width:1120px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .logo { width:34px; height:34px; border-radius:8px; background:var(--navy); position:relative; display:grid; place-items:center; border:1px solid rgba(255,255,255,.2); flex:none; }
  .logo svg { width:21px; height:21px; }
  .logo::after { content:""; position:absolute; right:3px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--arancio); border:1.4px solid var(--navy); }
  .barra h1 { font-size:20px; margin:0; font-weight:700; }
  .barra .comune { color:var(--debole); font-weight:500; font-size:15px; flex:1; min-width:140px; }
  .pill { height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--linea); background:var(--scheda); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
  .schede-tab { max-width:1120px; margin:0 auto; padding:0 20px; display:flex; gap:8px; }
  .tab { height:44px; padding:0 18px; border-radius:22px; border:0; background:transparent; color:var(--debole); font-weight:500; cursor:pointer; }
  .tab.attiva { background:var(--scheda); color:var(--testo); font-weight:700; }
  main { max-width:1120px; margin:0 auto; padding:16px 20px 60px; display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; }
  main.pieno { grid-template-columns:minmax(0,1fr); }
  @media (max-width:880px) { main { grid-template-columns:1fr; } }
  .avviso { grid-column:1/-1; background:var(--chip); color:var(--debole); border-radius:14px; padding:10px 14px; font-size:13px; }
  .scheda { background:var(--scheda); border-radius:22px; padding:18px; margin-bottom:12px; }
  h2 { font-size:26px; line-height:1.25; margin:0 0 8px; }
  h3 { font-size:17px; margin:0 0 6px; }
  .debole { color:var(--debole); }
  .etichetta-sez { font-size:12px; font-weight:700; letter-spacing:1px; color:var(--debole); margin:24px 4px 10px; text-transform:uppercase; }
  /* righe come le ListTile della Home */
  .riga-az { display:flex; align-items:center; gap:14px; width:100%; background:var(--scheda); border:0; border-radius:22px; padding:12px 16px; margin-bottom:10px; cursor:pointer; text-align:left; }
  .riga-az:hover { filter:brightness(.98); }
  .riga-az .ic { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; flex:none; }
  .riga-az .ic svg { width:24px; height:24px; }
  .riga-az b { display:block; font-size:17px; }
  .riga-az span.sub { font-size:14px; color:var(--debole); }
  .riga-az .fr { margin-left:auto; color:var(--debole); }
  .btn { display:block; width:100%; border-radius:999px; font-weight:700; padding:14px 18px; cursor:pointer; border:0; background:var(--arancio); color:#1B1F23; margin-top:10px; font-size:16px; }
  .btn.sec { background:transparent; color:var(--testo); border:1px solid var(--linea); font-weight:500; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .etichetta { display:inline-block; border-radius:20px; padding:5px 12px; font-weight:700; font-size:14px; margin-bottom:10px; }
  .ok { background:var(--okS); color:var(--okT); }
  .avv { background:var(--avvS); color:var(--avvT); }
  .riga { display:flex; align-items:center; gap:10px; padding:4px 0; }
  .bin { width:24px; height:24px; flex:none; }
  .link { background:none; border:0; color:var(--accento); font-weight:700; cursor:pointer; padding:0; }
  .testo { background:var(--sfondo); border-radius:12px; padding:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 18px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; max-width:90vw; z-index:5; }
  /* anteprima: la carta blu "Prossimi ritiri" dell'app */
  .carta { background:var(--pannello); color:#fff; border-radius:28px; padding:22px; position:relative; overflow:hidden; }
  .carta .filigrana { position:absolute; right:-34px; bottom:-46px; width:220px; height:220px; opacity:.08; }
  .carta .sopra { font-size:12px; font-weight:700; letter-spacing:1.2px; color:var(--arancio); display:flex; align-items:center; gap:6px; }
  .carta h3 { font-size:24px; margin:10px 0 4px; }
  .carta .sub { color:var(--chiaro); font-size:14px; margin-bottom:12px; }
  .elenco { background:var(--scheda); color:var(--testo); border-radius:22px; margin-top:12px; overflow:hidden; }
  .giorno { padding:12px 16px; border-top:1px solid var(--linea); }
  .giorno:first-child { border-top:0; }
  .giorno.spostato { box-shadow:inset 4px 0 0 var(--arancio); }
  .giorno .data { font-weight:600; color:var(--debole); font-size:14px; margin-bottom:4px; }
  .scelte { background:var(--scheda); border-radius:22px; padding:6px; }
  label.scelta { display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:14px; cursor:pointer; }
  label.scelta:hover { background:var(--chip); }
  label.scelta input { accent-color:var(--arancio); width:18px; height:18px; }
  input[type=date], input[type=text], input[type=password] { padding:12px 14px; border-radius:14px; border:1px solid var(--linea); background:var(--scheda); width:100%; }
  .storico { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .chip { height:40px; padding:0 16px; border-radius:20px; border:1px solid var(--linea); background:var(--scheda); cursor:pointer; }
  .chip.sel { background:var(--pannello); color:#fff; border-color:var(--pannello); font-weight:700; }
  .griglia { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; }
  .numero { font-size:34px; font-weight:700; }
  .barre { display:flex; align-items:flex-end; gap:10px; height:190px; border-bottom:1px solid var(--linea); padding-top:8px; }
  .barre .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .barre .b { width:100%; max-width:52px; border-radius:6px 6px 0 0; background:var(--accento); }
  .barre .b.picco { background:var(--arancio); }
  .assi { display:flex; gap:10px; }
  .assi div { flex:1; text-align:center; font-size:12px; color:var(--debole); padding-top:6px; }
  .orizz { display:flex; align-items:center; gap:12px; padding:5px 0; }
  .orizz .nome { width:140px; }
  .orizz .traccia { flex:1; height:12px; border-radius:6px; background:var(--linea); overflow:hidden; }
  .orizz .traccia div { height:12px; background:var(--accento); }
  .orizz .n { width:40px; text-align:right; font-weight:700; }
  :root.scuro .barre .b:not(.picco), :root.scuro .orizz .traccia div { background:#6FA8D6; }
</style>
</head>
<body>
<div class="barra">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40"><path fill="#fff" d="M17 4h6a2 2 0 012 2v0a2 2 0 01-2 2h-6a2 2 0 01-2-2 2 2 0 012-2zM8 7.5h24a2 2 0 012 2v1a2 2 0 01-2 2H8a2 2 0 01-2-2v-1a2 2 0 012-2zM9 14h22l-2 19q0 3-3 3H14q-3 0-3-3z"/></svg></div>
  <h1>Eco Calendario</h1>
  <span class="comune" id="titolo">Area del Comune</span>
  <select class="pill" id="scegliComune" aria-label="Comune"></select>
  <button class="pill" id="tema" type="button">Tema</button>
</div>
<div class="schede-tab" role="tablist">
  <button class="tab attiva" id="tabCal" role="tab" type="button">Calendario</button>
  <button class="tab" id="tabSeg" role="tab" type="button">Segnalazioni</button>
</div>
<main id="main">
  <div class="avviso">Demo dell'area del Comune: le modifiche al calendario restano solo in questo browser e non arrivano ai cittadini.</div>
  <section id="sinistra"><p class="debole">Caricamento…</p></section>
  <aside id="destra"></aside>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/pdf,image/*" hidden>
<script>
const BASE = './';
const NOMI = { organico:'organico', carta:'carta', vetro:'vetro', plastica:'plastica', indifferenziato:'indifferenziato', sfalci:'sfalci', lattine:'lattine' };
const COLORI = { organico:'#8B5E3C', carta:'#E0A800', vetro:'#1F6FB2', plastica:'#2AA7DF', indifferenziato:'#6B7280', sfalci:'#3A9B4B', lattine:'#8A939E' };
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const GIORNI_BREVI = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
// il bidone dell'app (BidonePainter), su una griglia 40x40
const BIDONE = 'M17 4h6a2 2 0 012 2v0a2 2 0 01-2 2h-6a2 2 0 01-2-2 2 2 0 012-2zM8 7.5h24a2 2 0 012 2v1a2 2 0 01-2 2H8a2 2 0 01-2-2v-1a2 2 0 012-2zM9 14h22l-2 19q0 3-3 3H14q-3 0-3-3z';
const bin = (t, cls = 'bin') => `<svg class="${cls}" viewBox="0 0 40 40" role="img" aria-label="${NOMI[t] || t}"><path fill="${COLORI[t] || '#6B7280'}" d="${BIDONE}"/></svg>`;
const ICONE = {
  carica: '<svg viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  prova: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  sposta: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  stat: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
};

const st = { indice:null, comune:null, zone:[], dati:{}, scheda:'cal', passo:'home', documenti:[], dubbi:[], ok:[], risposte:{}, da:null, tipo:null, zoneSposta:new Set(), a:null, ultima:null, stat:null, statErr:null, zonaStat:'tutte', servizio:null };

function leggi(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const kDoc = () => 'eco_comune_doc_' + st.comune.id;
const kVar = () => 'eco_comune_var_' + st.comune.id;
const kCod = () => 'eco_comune_codice_' + st.comune.id;

// ---------- tema: segue il sistema, il pulsante lo cambia ----------
const sistemaScuro = matchMedia('(prefers-color-scheme: dark)');
function applicaTema() {
  const scelto = leggi('eco_tema', null);
  const scuro = scelto ? scelto === 'scuro' : sistemaScuro.matches;
  document.documentElement.classList.toggle('scuro', scuro);
  document.getElementById('tema').textContent = scuro ? '☀ Tema chiaro' : '☾ Tema scuro';
}
document.getElementById('tema').onclick = () => {
  scrivi('eco_tema', document.documentElement.classList.contains('scuro') ? 'chiaro' : 'scuro');
  applicaTema();
};
sistemaScuro.addEventListener('change', applicaTema);
applicaTema();

// ---------- utilità ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chiave = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daChiave = k => { const [a,m,g] = k.split('-').map(Number); return new Date(a, m-1, g); };
const dataLunga = k => { const d = daChiave(k); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; };
const dataBreve = k => { const d = daChiave(k); return `${GIORNI_BREVI[d.getDay()]} ${d.getDate()}`; };
const dataAnno = k => { const d = daChiave(k); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const maiusc = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const nome = t => NOMI[t] || t;
const nomeZona = id => (st.zone.find(z => z.id === id) || {nome:id}).nome;
const dove = ids => (st.zone.length <= 1 || ids.length === st.zone.length) ? 'in tutto il Comune' : ids.map(nomeZona).join(', ');
const oggi = chiave(new Date());
const num = n => String(n);
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500); }
function rigaAz(azione, icona, sfondo, titolo, sotto) {
  return `<button class="riga-az" type="button" data-a="${azione}"><span class="ic" style="background:${sfondo}">${ICONE[icona]}</span><span><b>${titolo}</b>${sotto ? `<span class="sub">${sotto}</span>` : ''}</span><span class="fr" aria-hidden="true">›</span></button>`;
}

function festivita(anno) {
  const a = anno % 19, b = Math.floor(anno/100), c = anno % 100, d = Math.floor(b/4), e = b % 4;
  const f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7, m = Math.floor((a+11*h+22*l)/451);
  const mese = Math.floor((h+l-7*m+114)/31), giorno = ((h+l-7*m+114) % 31) + 1;
  const p = new Date(anno, mese-1, giorno), pp = new Date(anno, mese-1, giorno+1);
  const r = {}; const s = (mm, gg, n) => r[chiave(new Date(anno, mm-1, gg))] = n;
  s(1,1,'Capodanno'); s(1,6,'Epifania'); s(4,25,'Festa della Liberazione'); s(5,1,'Festa del lavoro'); s(6,2,'Festa della Repubblica');
  s(8,15,'Ferragosto'); s(11,1,'Ognissanti'); s(12,8,'Immacolata'); s(12,25,'Natale'); s(12,26,'Santo Stefano');
  r[chiave(p)] = 'Pasqua'; r[chiave(pp)] = 'Pasquetta';
  return r;
}

// ---------- dati ----------
async function scarica(f) { const r = await fetch(BASE + f, {cache:'no-cache'}); if (!r.ok) throw new Error(f); return r.json(); }

function conVariazioni(dati, zona) {
  const vv = leggi(kVar(), []).filter(v => v.zone.includes(zona));
  if (!vv.length) return dati;
  const c = JSON.parse(JSON.stringify(dati));
  c.eccezioni = c.eccezioni || [];
  for (const v of vv) {
    const prima = c.raccolte[v.da] || [];
    if (!prima.includes(v.raccolta)) continue;
    const resto = prima.filter(x => x !== v.raccolta);
    if (resto.length) c.raccolte[v.da] = resto; else delete c.raccolte[v.da];
    const dopo = c.raccolte[v.a] || [];
    if (!dopo.includes(v.raccolta)) dopo.push(v.raccolta);
    c.raccolte[v.a] = dopo;
    c.eccezioni.push({data:v.a, tipo:'spostato', raccolta:v.raccolta, da:v.da});
  }
  return c;
}

async function caricaZone() {
  st.dati = {};
  await Promise.all(st.zone.map(async z => {
    try { st.dati[z.id] = conVariazioni(await scarica(z.file), z.id); } catch {}
  }));
}

function comuneIntero() {
  const r = {};
  for (const z of st.zone) {
    const d = st.dati[z.id]; if (!d) continue;
    for (const [g, tt] of Object.entries(d.raccolte)) for (const t of tt) ((r[g] ??= {})[t] ??= []).push(z.id);
  }
  return Object.fromEntries(Object.entries(r).sort(([a],[b]) => a.localeCompare(b)));
}
function spostati() {
  const s = new Set();
  for (const d of Object.values(st.dati)) for (const e of d.eccezioni || []) if (e.tipo === 'spostato') s.add(e.data);
  return s;
}

function analizza() {
  st.ok = []; st.dubbi = []; st.risposte = {};
  const dd = Object.values(st.dati); if (!dd.length) return;
  const al = dd.map(d => d.valido_al).sort()[0];
  const dal = dd.map(d => d.valido_dal).filter(Boolean).sort().pop();
  st.ok.push(`Valido ${dal ? 'dal ' + dataAnno(dal) + ' ' : ''}al ${dataAnno(al)}`);
  st.ok.push(st.zone.length === 1 ? 'Una sola zona nel Comune' : `${st.zone.length} zone nel Comune, tutte controllate`);
  const tutto = comuneIntero();
  st.ok.push(`${Object.keys(tutto).length} giorni di raccolta letti, nessuna data fuori periodo`);
  for (const [g, rr] of Object.entries(tutto)) {
    if (g < oggi) continue;
    const f = festivita(+g.slice(0,4))[g]; if (!f) continue;
    for (const [t, zz] of Object.entries(rr)) st.dubbi.push({ chiave:g+'|'+t, data:g, testo:`Il ${dataAnno(g)} (${f}) è indicato il ritiro ${nome(t)} ${dove(zz)}. È corretto?` });
  }
  if (!st.dubbi.length) st.ok.push('Nessun ritiro nei giorni festivi');
}

// ---------- azioni ----------
const file = document.getElementById('file');
file.onchange = () => { const f = file.files[0]; if (f) aggiungiDocumento(`${f.name} (${Math.round(f.size/1024)} KB)`); file.value = ''; };

function aggiungiDocumento(n) {
  const ora = new Date();
  st.documenti.unshift({ nome:n, ricevuto:`${String(ora.getHours()).padStart(2,'0')}:${String(ora.getMinutes()).padStart(2,'0')}`, stato:'in verifica' });
  scrivi(kDoc(), st.documenti); disegna();
  setTimeout(() => { analizza(); st.documenti[0].stato = st.dubbi.length ? 'da chiarire' : 'pronto'; scrivi(kDoc(), st.documenti); disegna(); }, 2000);
}

async function pubblica() {
  const v = { zone:[...st.zoneSposta].sort(), da:st.da, a:st.a, raccolta:st.tipo, quando:new Date().toISOString().slice(0,16).replace('T',' ') };
  scrivi(kVar(), [...leggi(kVar(), []), v]);
  await caricaZone();
  st.ultima = v; st.passo = 'fatto';
  toast(`Avviso inviato: ${maiusc(nome(v.raccolta))} del ${dataAnno(v.da)} passa a ${dataAnno(v.a)} (${dove(v.zone)}).`);
  disegna();
}

async function annulla(i) {
  const tutte = leggi(kVar(), []); tutte.splice(i, 1); scrivi(kVar(), tutte);
  await caricaZone(); disegna();
}

// ---------- segnalazioni dei cittadini (servizio cloud) ----------
async function caricaStatistiche() {
  st.stat = null; st.statErr = null; disegna();
  const codice = leggi(kCod(), '');
  if (!codice) { st.statErr = 'codice'; disegna(); return; }
  try {
    if (!st.servizio) st.servizio = (await scarica('app.json')).ai_url;
    const r = await fetch(`${st.servizio}/comune/${encodeURIComponent(st.comune.id)}/segnalazioni?codice=${encodeURIComponent(codice)}`);
    if (r.status === 403) { st.statErr = 'accesso'; disegna(); return; }
    if (!r.ok) throw new Error(r.status);
    st.stat = await r.json();
  } catch { st.statErr = 'rete'; }
  disegna();
}

function segnalazioni() {
  if (st.statErr === 'codice' || st.statErr === 'accesso') {
    return `<h2>Segnalazioni dei cittadini</h2>
      <p class="debole">${st.statErr === 'accesso' ? 'Il codice non è corretto per questo Comune.' : 'Inserisci il codice di accesso del Comune che ti abbiamo dato.'}</p>
      <div class="scheda"><label for="codice"><b>Codice di accesso</b></label>
      <input type="password" id="codice" autocomplete="off" style="margin-top:8px">
      <button class="btn" data-a="codice">Entra</button></div>`;
  }
  if (st.statErr === 'rete') return `<h2>Segnalazioni dei cittadini</h2><p class="debole">Non riesco a leggere le segnalazioni ora. Riprova tra poco.</p><button class="btn sec" data-a="ricarica">Riprova</button>`;
  if (!st.stat) return '<p class="debole">Caricamento…</p>';
  const righe = st.stat.segnalazioni.filter(r => st.zonaStat === 'tutte' || r.zona === st.zonaStat);
  const oggiD = new Date(); oggiD.setHours(0,0,0,0);
  const lun = new Date(oggiD); lun.setDate(lun.getDate() - ((lun.getDay() + 6) % 7));
  const giorni = []; for (let i = 0; i < 7; i++) { const d = new Date(lun); d.setDate(d.getDate() + i); giorni.push(d); }
  const in8 = new Date(lun); in8.setDate(in8.getDate() - 49);
  const in16 = new Date(lun); in16.setDate(in16.getDate() - 105);
  const perG = Array(7).fill(0), det = {}; let ult8 = 0, prima8 = 0;
  for (const r of righe) {
    const g = daChiave(r.giorno);
    if (g >= in8) ult8 += r.n; else if (g >= in16) prima8 += r.n;
    const i = Math.round((g - lun) / 864e5);
    if (i >= 0 && i < 7) { perG[i] += r.n; const k = r.raccolta + '|' + r.zona; (det[r.giorno] ??= {})[k] = ((det[r.giorno] || {})[k] || 0) + r.n; }
  }
  const max = Math.max(1, ...perG), diff = ult8 - prima8;
  const errori = st.stat.errori.filter(e => st.zonaStat === 'tutte' || e.zona === st.zonaStat);
  const fine = giorni[6];
  return `<h2>Segnalazioni di presunto mancato ritiro</h2>
    <p class="debole">Quante volte i cittadini, da «Segnala mancato ritiro» nell'app, hanno scelto il ritiro saltato e poi chiamato il gestore o aperto il suo modulo online. Non prova il disservizio: indica dove è stato segnalato un ritiro saltato.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0">
      <button class="chip ${st.zonaStat === 'tutte' ? 'sel' : ''}" data-zs="tutte">Tutto il Comune</button>
      ${st.zone.map(z => `<button class="chip ${st.zonaStat === z.id ? 'sel' : ''}" data-zs="${esc(z.id)}">${esc(z.nome)}</button>`).join('')}
    </div>
    <div class="scheda"><div class="debole">Ultime 8 settimane</div><div class="numero">${ult8}</div><div class="debole">${diff >= 0 ? '+' : ''}${diff} rispetto alle 8 settimane prima</div></div>
    <div class="scheda"><h3>Settimana dal ${lun.getDate()}/${lun.getMonth()+1} al ${fine.getDate()}/${fine.getMonth()+1}</h3>
      <div class="barre" role="img" aria-label="Segnalazioni per giorno della settimana in corso">${perG.map((n,i) => `<div class="col"><b style="font-size:13px">${n}</b><div class="b ${chiave(giorni[i]) === oggi ? 'picco' : ''}" style="height:${4 + Math.round(150*n/max)}px"></div></div>`).join('')}</div>
      <div class="assi">${giorni.map(d => `<div><b style="color:var(--testo)">${GIORNI_BREVI[d.getDay()]}</b><br>${d.getDate()}/${d.getMonth()+1}</div>`).join('')}</div></div>
    <div class="scheda"><h3>Dettaglio della settimana</h3>
      ${Object.keys(det).length ? giorni.filter(d => det[chiave(d)]).map(d => `<div style="margin-top:10px"><div class="debole" style="font-weight:700">${esc(maiusc(dataLunga(chiave(d))))}</div>${Object.entries(det[chiave(d)]).map(([k,n]) => { const [t,z] = k.split('|'); return `<div class="riga">${bin(t)}<span style="flex:1">${esc(maiusc(nome(t)))} · ${esc(nomeZona(z))}</span><b>${n}</b></div>`; }).join('')}</div>`).join('') : '<p class="debole">Nessuna segnalazione questa settimana.</p>'}
    </div>
    <div class="scheda"><h3>Errori nel calendario segnalati dai cittadini</h3><p class="debole" style="font-size:14px;margin-top:0">Separati dai mancati ritiri: riguardano le date pubblicate, non il servizio.</p>
      ${errori.length ? errori.map(e => `<div class="testo" style="margin-bottom:8px">«${esc(e.testo)}»<div class="debole" style="font-size:13px;margin-top:4px">${esc(nomeZona(e.zona))} · ${e.n === 1 ? '1 cittadino' : e.n + ' cittadini'}</div></div>`).join('') : '<p class="debole">Nessuna segnalazione negli ultimi 90 giorni.</p>'}</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <button class="pill" data-a="csv">Scarica lo storico (CSV)</button>
      <button class="pill" data-a="stampa">Stampa o salva PDF</button>
      <span class="debole" style="font-size:13px">Giorno per giorno, con zero dove non ci sono segnalazioni · dati conservati 24 mesi</span>
    </div>`;
}

function scaricaCsv() {
  // storico giorno per giorno: tutte le date dalla prima segnalazione (o da 8 settimane fa) a oggi, zero dove non c'è nulla
  const tutte = st.stat.segnalazioni.filter(r => st.zonaStat === 'tutte' || r.zona === st.zonaStat);
  const per = {};
  for (const r of tutte) { const k = `${r.giorno}|${r.zona}|${r.raccolta}`; per[k] = (per[k] || 0) + r.n; }
  const inizio = new Date(); inizio.setHours(0,0,0,0); inizio.setDate(inizio.getDate() - 56);
  for (const r of tutte) { const g = daChiave(r.giorno); if (g < inizio) inizio.setTime(g.getTime()); }
  const righe = [['data','giorno','zona','raccolta','segnalazioni']];
  for (const d = new Date(inizio); chiave(d) <= oggi; d.setDate(d.getDate() + 1)) {
    const k = chiave(d), voci = Object.entries(per).filter(([x]) => x.startsWith(k + '|'));
    if (!voci.length) righe.push([k, GIORNI[d.getDay()], '', '', 0]);
    for (const [x, n] of voci) { const [, z, t] = x.split('|'); righe.push([k, GIORNI[d.getDay()], nomeZona(z), nome(t), n]); }
  }
  const csv = righe.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'}));
  a.download = `segnalazioni-${st.comune.id}.csv`; a.click();
}

// ---------- interfaccia del calendario ----------
function anteprima() {
  const sp = spostati();
  const pross = Object.entries(comuneIntero()).filter(([g]) => g >= oggi).slice(0, 7);
  return `<div class="carta"><svg class="filigrana" viewBox="0 0 40 40" aria-hidden="true"><path fill="#fff" d="${BIDONE}"/></svg>
      <div class="sopra">● PROSSIMI RITIRI NEL COMUNE</div>
      <h3>${esc(st.comune.nome)}</h3><div class="sub">Così li vedono i cittadini nell'app</div></div>
    <div class="elenco">${pross.map(([g, rr]) => `<div class="giorno ${sp.has(g) ? 'spostato' : ''}"><div class="data">${esc(maiusc(dataBreve(g)))}${sp.has(g) ? ' · <span style="color:var(--arancio)">spostato</span>' : ''}</div>` +
      Object.entries(rr).map(([t, zz]) => `<div class="riga">${bin(t)}<span><b>${esc(maiusc(nome(t)))}</b> · <span class="debole">${esc(dove(zz))}</span></span></div>`).join('') +
      `</div>`).join('')}</div>`;
}

function home() {
  const vv = leggi(kVar(), []);
  return `<h2>Ti è arrivato un calendario o una comunicazione del gestore?</h2>
    <p class="debole">Caricala qui: la leggiamo noi, controlliamo date e zone e ti avvisiamo quando è pronta da approvare.</p>
    <div style="margin-top:16px">
    ${rigaAz('carica', 'carica', 'var(--arancio)', 'Carica il PDF o la foto del gestore', 'La leggiamo e controlliamo noi')}
    ${rigaAz('prova', 'prova', 'var(--navy)', 'Prova con il calendario in uso', 'Controlli su tutte le zone')}
    ${rigaAz('sposta', 'sposta', COLORI.vetro, 'Sposta un ritiro', 'Variazione con avviso ai cittadini')}
    ${rigaAz('vaiSeg', 'stat', COLORI.sfalci, 'Segnalazioni dei cittadini', 'Mancati ritiri ed errori nel calendario')}
    </div>
    <div class="etichetta-sez">I tuoi documenti</div>
    ${st.documenti.length ? '' : '<p class="debole" style="margin-left:4px">Nessun documento caricato.</p>'}
    ${st.documenti.slice(0,5).map(d => `<div class="scheda"><h3>${esc(d.nome)}</h3><div class="debole">${
      d.stato === 'in verifica' ? `Ricevuto alle ${d.ricevuto}. Ti avvisiamo quando è pronto da approvare.` :
      d.stato === 'pronto' ? 'Controllato: tutto in ordine.' : d.stato === 'pubblicato' ? 'Approvato.' : 'Controllato: c\'è una data da chiarire.'}</div>
      ${d.stato !== 'in verifica' && d.stato !== 'pubblicato' ? '<button class="btn" data-a="anteprima">Vedi anteprima</button>' : ''}</div>`).join('')}
    ${vv.length ? `<div class="etichetta-sez">Storico variazioni</div>` + vv.map((v, i) => `<div class="scheda storico"><div><b>${esc(maiusc(nome(v.raccolta)))}: ${dataAnno(v.da)} → ${dataAnno(v.a)}</b><div class="debole" style="font-size:14px">${esc(maiusc(dove(v.zone)))} · pubblicata il ${esc(v.quando)}</div></div><button class="link" data-annulla="${i}">Annulla</button></div>`).reverse().join('') : ''}`;
}

function verifica() {
  const aperti = st.dubbi.filter(d => st.risposte[d.chiave] !== 'si');
  return `<span class="etichetta ${aperti.length ? 'avv' : 'ok'}">${aperti.length ? 'Una domanda per te' : 'Tutto in ordine'}</span>
    <h2>${aperti.length ? 'Quasi pronto: c\'è una data da chiarire' : 'Pronto da pubblicare'}</h2>
    <div class="scheda">${st.ok.map(c => `<div class="riga"><span style="color:var(--okT);font-weight:700">✓</span> ${esc(c)}</div>`).join('')}</div>
    ${st.dubbi.map(d => { const r = st.risposte[d.chiave]; return `<div class="scheda"><h3>${esc(d.testo)}</h3><div class="debole">Ci sembra strano perché è un giorno festivo.</div>
      ${!r ? `<button class="btn" data-si="${d.chiave}">Sì, confermato dal gestore</button><button class="btn sec" data-no="${d.chiave}">No, da chiarire</button>` :
        r === 'si' ? '<p class="debole">Confermato.</p>' :
        r === 'no' ? `<button class="btn sec" data-affida="${d.chiave}">Verificatelo voi col gestore</button>` :
        '<p class="debole">Affidato a Eco Calendario: questa data resta in verifica.</p>'}</div>`; }).join('')}
    <button class="btn" data-a="pubblicaDoc">${aperti.length ? 'Pubblica le date già confermate' : 'Pubblica'}</button>`;
}

function sposta() {
  const tutto = comuneIntero();
  const pross = Object.entries(tutto).filter(([g]) => g >= oggi).slice(0, 10);
  const zz = st.da ? (tutto[st.da]?.[st.tipo] || []) : [];
  const max = st.da ? chiave(new Date(daChiave(st.da).getTime() + 60*864e5)) : '';
  return `<h2>Sposta un ritiro</h2><p class="debole">Scegli il ritiro e il nuovo giorno: vale per tutte le zone che lo hanno quel giorno e i cittadini ricevono l'avviso.</p>
    <div class="scelte">${pross.map(([g, rr]) => Object.entries(rr).map(([t, z]) => `<label class="scelta"><input type="radio" name="r" data-da="${g}" data-t="${t}" ${st.da === g && st.tipo === t ? 'checked' : ''}>${bin(t)}<span><b>${esc(maiusc(nome(t)))} · ${esc(dataLunga(g))}</b><br><span class="debole" style="font-size:14px">${esc(maiusc(dove(z)))}</span></span></label>`).join('')).join('')}</div>
    ${zz.length > 1 ? `<div class="etichetta-sez">Vale per</div><div class="scelte">${zz.map(z => `<label class="scelta"><input type="checkbox" data-z="${z}" ${st.zoneSposta.has(z) ? 'checked' : ''}><span>${esc(nomeZona(z))}</span></label>`).join('')}</div>` : ''}
    <div class="etichetta-sez">Nuovo giorno</div>
    <input type="date" id="nuovo" ${st.da ? '' : 'disabled'} min="${oggi}" max="${max}" value="${st.a || ''}">
    <button class="btn" data-a="pubblicaVar" ${st.da && st.a && st.zoneSposta.size ? '' : 'disabled'}>Pubblica e avvisa i cittadini</button>`;
}

function fatto() {
  const v = st.ultima, d = v ? dove(v.zone) : 'in tutto il Comune';
  const testo = v ? `Raccolta rifiuti: il ritiro ${nome(v.raccolta)} del ${dataAnno(v.da)} passa a ${dataAnno(v.a)} (${d}). Le date aggiornate sono sull'app Eco Calendario.`
    : 'È in vigore il calendario della raccolta rifiuti aggiornato. Le date sono sull\'app Eco Calendario.';
  const inVer = [...new Set(st.dubbi.filter(x => ['no','affidato'].includes(st.risposte[x.chiave])).map(x => dataAnno(x.data)))];
  return `<span class="etichetta ok">Fatto</span><h2>Ecco cosa vedono ora i cittadini</h2>
    <div class="scheda"><h3>Pubblicato ${d === 'in tutto il Comune' ? d : 'per ' + esc(d)}</h3><div class="debole">${v ? 'Già nell\'app. Avviso inviato ai cittadini interessati.' : 'Nessun avviso: per i cittadini non cambia nulla.'}</div>
    ${inVer.length ? `<p class="debole">In verifica: ${inVer.join(', ')}. L'avviso partirà dopo il chiarimento.</p>` : ''}</div>
    <div class="scheda"><h3>Testo pronto per il sito del Comune e i social</h3><div class="testo" id="testo">${esc(testo)}</div><button class="btn sec" data-a="copia">Copia il testo</button></div>
    <button class="btn" data-a="home">Torna all'inizio</button>`;
}

function disegna() {
  const sx = document.getElementById('sinistra'), dx = document.getElementById('destra');
  document.getElementById('tabCal').classList.toggle('attiva', st.scheda === 'cal');
  document.getElementById('tabSeg').classList.toggle('attiva', st.scheda === 'seg');
  document.getElementById('main').classList.toggle('pieno', st.scheda === 'seg');
  if (st.scheda === 'seg') { sx.innerHTML = segnalazioni(); dx.innerHTML = ''; return; }
  sx.innerHTML = (st.passo !== 'home' ? `<button class="link" data-a="home" style="margin-bottom:12px">← Indietro</button>` : '') + ({ verifica, sposta, fatto }[st.passo] || home)();
  dx.innerHTML = anteprima();
}

document.getElementById('tabCal').onclick = () => { st.scheda = 'cal'; disegna(); };
document.getElementById('tabSeg').onclick = () => { st.scheda = 'seg'; caricaStatistiche(); };

document.getElementById('sinistra').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'carica') file.click();
  else if (a === 'prova') aggiungiDocumento('Calendario in uso nell\'app (prova)');
  else if (a === 'sposta') { Object.assign(st, { passo:'sposta', da:null, tipo:null, a:null, zoneSposta:new Set() }); disegna(); }
  else if (a === 'vaiSeg') { st.scheda = 'seg'; caricaStatistiche(); }
  else if (a === 'anteprima') { analizza(); st.passo = 'verifica'; disegna(); }
  else if (a === 'home') { st.passo = 'home'; disegna(); }
  else if (a === 'pubblicaDoc') { if (st.documenti[0]) st.documenti[0].stato = 'pubblicato'; scrivi(kDoc(), st.documenti); st.ultima = null; st.passo = 'fatto'; disegna(); }
  else if (a === 'pubblicaVar') pubblica();
  else if (a === 'copia') { navigator.clipboard?.writeText(document.getElementById('testo').textContent).then(() => toast('Testo copiato'), () => toast('Copia non riuscita: seleziona il testo')); }
  else if (a === 'codice') { scrivi(kCod(), document.getElementById('codice').value.trim()); caricaStatistiche(); }
  else if (a === 'ricarica') caricaStatistiche();
  else if (a === 'csv') scaricaCsv();
  else if (a === 'stampa') print();
  else if (b.dataset.zs) { st.zonaStat = b.dataset.zs; disegna(); }
  else if (b.dataset.si) { st.risposte[b.dataset.si] = 'si'; disegna(); }
  else if (b.dataset.no) { st.risposte[b.dataset.no] = 'no'; disegna(); }
  else if (b.dataset.affida) {
    const d = st.dubbi.find(x => x.chiave === b.dataset.affida);
    location.href = 'mailto:info.ecocalendario@gmail.com?subject=' + encodeURIComponent('Verifica data ' + st.comune.nome) + '&body=' + encodeURIComponent(d.testo);
    st.risposte[b.dataset.affida] = 'affidato'; disegna();
  }
  else if (b.dataset.annulla) annulla(+b.dataset.annulla);
});
document.getElementById('sinistra').addEventListener('change', e => {
  const i = e.target;
  if (i.name === 'r') { const zz = comuneIntero()[i.dataset.da][i.dataset.t]; Object.assign(st, { da:i.dataset.da, tipo:i.dataset.t, a:null, zoneSposta:new Set(zz) }); disegna(); }
  else if (i.dataset.z) { i.checked ? st.zoneSposta.add(i.dataset.z) : st.zoneSposta.delete(i.dataset.z); disegna(); }
  else if (i.id === 'nuovo') { st.a = i.value || null; disegna(); }
});
document.getElementById('sinistra').addEventListener('keydown', e => {
  if (e.target.id === 'codice' && e.key === 'Enter') { scrivi(kCod(), e.target.value.trim()); caricaStatistiche(); }
});

async function apriComune(id) {
  const c = st.indice.comuni.find(x => x.id === id) || st.indice.comuni.find(x => x.id === 'castiglione-torinese') || st.indice.comuni[0];
  st.comune = c; st.zone = c.zone.filter(z => z.file);
  document.getElementById('titolo').textContent = 'Area del Comune di ' + c.nome;
  document.getElementById('scegliComune').value = c.id;
  document.title = 'Eco Calendario · Comune di ' + c.nome + ' (demo)';
  const q = new URLSearchParams(location.search);
  q.set('comune', c.id);
  history.replaceState(null, '', '?' + q.toString());
  st.documenti = leggi(kDoc(), []); st.passo = 'home'; st.dubbi = []; st.ultima = null; st.zonaStat = 'tutte'; st.stat = null;
  document.getElementById('sinistra').innerHTML = '<p class="debole">Caricamento…</p>';
  await caricaZone();
  if (st.scheda === 'seg') caricaStatistiche(); else disegna();
}

(async () => {
  try {
    st.indice = await scarica('indice.json');
    const sel = document.getElementById('scegliComune');
    sel.innerHTML = [...st.indice.comuni].filter(c => (c.zone || []).some(z => z.file)).sort((a,b) => a.nome.localeCompare(b.nome, 'it'))
      .map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('');
    sel.onchange = () => apriComune(sel.value);
    const q = new URLSearchParams(location.search);
    if (q.get('vista') === 'segnalazioni') st.scheda = 'seg';
    await apriComune(q.get('comune'));
  } catch (e) {
    document.getElementById('sinistra').innerHTML = '<p>Non riesco a leggere i calendari. Riprova tra poco.</p>';
  }
})();
</script>
</body>
</html>
